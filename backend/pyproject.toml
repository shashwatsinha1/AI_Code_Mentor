[project]
name = "ai-code-mentor-backend"
version = "0.1.0"
description = "FastAPI backend for AI Code Mentor"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.3,<5",
    "email-validator>=2.2.0",
    "fastapi>=0.112.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
